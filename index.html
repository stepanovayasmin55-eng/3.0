<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GrammaLab Kids Ultra</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --p: #00a2ff; --bg: #f4f9ff; --ai: #6c5ce7; --s: #2ecc71; --r: #ff4757; 
            --dark: #2f3542; --shadow: 0 8px 0 rgba(0,0,0,0.1);
        }
        
        body { 
            margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg); color: var(--dark); overflow: hidden; touch-action: none; 
        }

        /* ШАПКА */
        header { 
            background: #fff; padding: 12px 20px; display: flex; 
            justify-content: space-between; align-items: center; 
            box-shadow: 0 2px 15px rgba(0,0,0,0.08); position: relative; z-index: 10;
        }
        .logo { font-weight: 900; color: var(--p); font-size: 22px; letter-spacing: -1px; }
        .score-box { background: var(--p); color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: 800; }

        /* ЭКРАНЫ */
        .screen { 
            display: none; padding: 20px; height: calc(100vh - 65px); 
            box-sizing: border-box; overflow-y: auto; scroll-behavior: smooth;
        }
        .active { display: block; animation: screenIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        @keyframes screenIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* КНОПКИ */
        .btn { 
            padding: 16px; border-radius: 22px; border: none; font-weight: 800; 
            cursor: pointer; width: 100%; margin: 8px 0; transition: 0.2s; 
            box-shadow: var(--shadow); font-size: 16px; position: relative; overflow: hidden;
        }
        .btn-p { background: var(--p); color: #fff; }
        .btn-ai { background: var(--ai); color: #fff; }
        .btn-white { background: #fff; color: var(--dark); }
        .btn:active { transform: translateY(4px); box-shadow: none; }

        /* ИГРОВОЕ ПОЛЕ */
        #stage { 
            height: 380px; position: relative; overflow: hidden; background: #fff; 
            border-radius: 30px; border: 5px solid var(--p); margin-bottom: 15px; 
            perspective: 1200px; box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }

        /* 1. АНИМАЦИЯ КАРТОЧКИ (3D) */
        .f-card { 
            position: absolute; width: 80%; left: 10%; top: 15%; background: #fff; 
            border-radius: 25px; padding: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); 
            transform: scale(0) rotateY(180deg); opacity: 0; 
            transition: 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); text-align: center; z-index: 5;
        }
        .f-card.active { transform: scale(1) rotateY(0deg); opacity: 1; }

        /* 2. ЛАБИРИНТ */
        #hero { 
            position: absolute; font-size: 40px; z-index: 10; 
            transition: 0.15s cubic-bezier(0.18, 0.89, 0.32, 1.28); filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
        }
        .gate { 
            position: absolute; right: 15px; border: 4px solid var(--p); 
            background: #fff; padding: 10px; border-radius: 15px; font-weight: 900; 
            width: 100px; text-align: center; font-size: 12px; box-shadow: 4px 4px 0 var(--p);
        }

        /* 3. КРОТЫ */
        .mole { 
            width: 80px; height: 100px; background: #8d6e63; border-radius: 40px 40px 10px 10px; 
            position: absolute; bottom: -120px; transition: 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
            display: flex; align-items: center; justify-content: center; color: #fff; 
            text-align: center; font-size: 11px; font-weight: bold; padding: 8px; box-sizing: border-box;
        }
        .mole.up { bottom: 30px; }

        /* 4. ПАДЕНИЕ (СОРТИРОВКА) */
        .drop-item { 
            position: absolute; top: -70px; background: var(--ai); color: #fff; 
            padding: 12px; border-radius: 15px; transition: 3.5s linear; 
            font-weight: 900; width: 90px; text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        /* ДЖОЙСТИК */
        .joy { 
            display: none; grid-template-columns: repeat(3, 1fr); gap: 8px; 
            width: 160px; margin: 0 auto; padding-bottom: 10px;
        }
        .j-btn { 
            background: #fff; border: 2px solid #ddd; padding: 15px; 
            border-radius: 18px; font-weight: 900; font-size: 20px; box-shadow: 0 4px 0 #ccc;
        }

        /* РЕДАКТОР КАРТОЧЕК */
        .factory-item { 
            background: #fff; padding: 15px; border-radius: 20px; 
            margin-bottom: 15px; border-left: 10px solid var(--ai); box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* МОДАЛКА */
        #qr-modal {
            display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); 
            z-index:1000; flex-direction:column; align-items:center; justify-content:center; color:#fff;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">GrammaLab</div>
    <div class="score-box" id="score-val">0 ⭐</div>
</header>

<div id="sc-menu" class="screen active">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <button class="btn btn-white" onclick="setMode('card')">🎴 Карточки</button>
        <button class="btn btn-white" onclick="setMode('maze')">👾 Лабиринт</button>
        <button class="btn btn-white" onclick="setMode('mole')">🔨 Кроты</button>
        <button class="btn btn-white" onclick="setMode('sort')">📦 Падение</button>
        <button class="btn btn-white" onclick="setMode('plane')">✈️ Полет</button>
        <button class="btn btn-white" onclick="setMode('anagram')">🔠 Буквы</button>
        <button class="btn btn-white" onclick="setMode('pairs')">👥 Пары</button>
        <button class="btn btn-white" onclick="setMode('quiz')">📝 Тест</button>
    </div>
    <button class="btn btn-p" onclick="importCode()" style="margin-top:20px;">📥 ЗАГРУЗИТЬ ПО КОДУ</button>
</div>

<div id="sc-edit" class="screen">
    <button class="btn btn-ai" onclick="aiAssistant()">✨ ИИ: ВЫБРАТЬ ТЕМУ (1-13)</button>
    <div id="factory"></div>
    <button class="btn btn-p" onclick="initPlay()">ИГРАТЬ ▶️</button>
    <button class="btn btn-white" onclick="exportCode()">📤 ПОЛУЧИТЬ КОД ИГРЫ</button>
</div>

<div id="sc-game" class="screen">
    <div id="game-topic" style="text-align:center; font-weight:900; color:var(--ai); margin-bottom:10px; font-size:14px; text-transform:uppercase;"></div>
    <div id="stage"></div>
    <div class="joy" id="joy-ctrl">
        <button></button><button class="j-btn" onclick="charMove(0,-35)">▲</button><button></button>
        <button class="j-btn" onclick="charMove(-35,0)">◄</button><button></button><button class="j-btn" onclick="charMove(35,0)">►</button>
        <button></button><button class="j-btn" onclick="charMove(0,35)">▼</button><button></button>
    </div>
    <div id="game-opts" style="display:grid; grid-template-columns: 1fr; gap:10px;"></div>
</div>

<div id="qr-modal">
    <div id="qrcode" style="background:#fff; padding:20px; border-radius:20px;"></div>
    <p style="margin-top:20px;">Твой секретный код скопирован!</p>
    <button class="btn btn-p" style="width:200px" onclick="document.getElementById('qr-modal').style.display='none'">ЗАКРЫТЬ</button>
</div>

<script>
    let currentMode = '', questions = [], cursor = 0, score = 0, charXY = {x:30, y:150};

    // БАЗА ЗНАНИЙ ПО ВСЕМ 13 ПУНКТАМ
    const KNOWLEDGE = {
        1: {t: "Существительное", q: "Найди слово общего рода:", a: ["Врач", "Непоседа", "Стол"], c: 1},
        2: {t: "Обращение", q: "Где запятая: 'Мама я дома'?", a: ["Перед Мама", "После Мама", "Нет"], c: 1},
        3: {t: "Типы речи", q: "Рассуждение — это когда мы...", a: ["Рисуем предмет", "Рассказываем историю", "Доказываем мысль"], c: 2},
        4: {t: "Лексика", q: "Выбери омонимы:", a: ["Холод - Жара", "Кран (вода) - Кран (стройка)", "Лес - Бор"], c: 1},
        5: {t: "Однородные", q: "Я люблю груши, яблоки и сливы. Где ОЧП?", a: ["Я люблю", "Груши, яблоки, сливы", "И сливы"], c: 1},
        7: {t: "Прямая речь", q: "Прямая речь заключается в...", a: ["Скобки", "Кавычки", "Тире"], c: 1},
        11: {t: "Тире П и С", q: "Где нужно тире?", a: ["Он учитель", "Москва столица", "Я бегу"], c: 1},
        13: {t: "Глагол", q: "Спряжение глагола 'строить':", a: ["1 спряжение", "2 спряжение", "Исключение"], c: 1}
    };

    function setMode(m) { currentMode = m; switchScreen('sc-edit'); }
    function switchScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    function aiAssistant() {
        let n = prompt("Номер темы (1-13):");
        let data = KNOWLEDGE[n] || {t: "Тема "+n, q: "Вопрос по пункту "+n, a: ["Вариант А", "Вариант Б", "Вариант В"], c: 0};
        
        let card = document.createElement('div'); card.className = 'factory-item';
        card.innerHTML = `
            <b>${data.t}</b><br>
            <input type="text" value="${data.q}" class="inp-q" style="width:100%; border:none; border-bottom:1px solid #eee; margin:8px 0; font-weight:bold;">
            ${data.a.map((ans, i) => `
                <div style="display:flex; gap:10px; margin-bottom:5px;">
                    <input type="text" value="${ans}" class="inp-a" style="flex:1; border:1px solid #eee; border-radius:8px; padding:5px;">
                    <input type="radio" name="r${Math.random()}" class="inp-c" ${i===data.c?'checked':''}>
                </div>
            `).join('')}
        `;
        card.dataset.topic = data.t;
        document.getElementById('factory').appendChild(card);
    }

    function collectData() {
        questions = [];
        document.querySelectorAll('.factory-item').forEach(item => {
            let opts = [];
            item.querySelectorAll('.inp-a').forEach((input, i) => {
                opts.push({ text: input.value, isCorrect: item.querySelectorAll('.inp-c')[i].checked });
            });
            questions.push({ topic: item.dataset.topic, qText: item.querySelector('.inp-q').value, options: opts });
        });
    }

    function initPlay() {
        collectData();
        if(questions.length > 0) { cursor = 0; score = 0; switchScreen('sc-game'); renderStep(); }
    }

    function renderStep() {
        let it = questions[cursor]; let stage = document.getElementById('stage'); let opts = document.getElementById('game-opts');
        stage.innerHTML = ""; opts.innerHTML = ""; document.getElementById('joy-ctrl').style.display = "none";
        document.getElementById('game-topic').innerText = it.topic;
        document.getElementById('score-val').innerText = score + " ⭐";

        if(currentMode === 'card') {
            stage.innerHTML = `<div class="f-card" id="card-obj"><h2>${it.qText}</h2><div id="card-btns"></div></div>`;
            setTimeout(() => document.getElementById('card-obj').classList.add('active'), 100);
            it.options.forEach(o => {
                let b = document.createElement('button'); b.className = "btn btn-p"; b.innerText = o.text;
                b.onclick = () => validate(o.isCorrect, b); document.getElementById('card-btns').appendChild(b);
            });
        } else if(currentMode === 'maze') {
            document.getElementById('joy-ctrl').style.display = "grid";
            stage.innerHTML = `<div id="hero" style="left:30px; top:150px;">👾</div>`;
            charXY = {x:30, y:150};
            it.options.forEach((o, i) => {
                let g = document.createElement('div'); g.className = "gate"; g.style.top = (40 + i*105) + "px";
                g.innerText = o.text; g.id = "g"+i; stage.appendChild(g);
            });
        } else if(currentMode === 'mole') {
            it.options.forEach((o, i) => {
                let m = document.createElement('div'); m.className = "mole"; m.innerText = o.text;
                m.style.left = (15 + i*30) + "%"; m.onclick = () => validate(o.isCorrect, m);
                stage.appendChild(m); setTimeout(() => m.classList.add('up'), 300 + i*250);
            });
        } else if(currentMode === 'sort') {
            it.options.forEach((o, i) => {
                let s = document.createElement('div'); s.className = "drop-item"; s.innerText = o.text;
                s.style.left = (15 + i*30) + "%"; s.onclick = () => validate(o.isCorrect, s);
                stage.appendChild(s); setTimeout(() => s.style.top = "300px", 100);
            });
        } else {
            stage.innerHTML = `<div style="text-align:center; padding:60px;"><h3>${it.qText}</h3></div>`;
            it.options.forEach(o => {
                let b = document.createElement('button'); b.className = "btn btn-p"; b.innerText = o.text;
                b.onclick = () => validate(o.isCorrect, b); opts.appendChild(b);
            });
        }
    }

    function charMove(dx, dy) {
        charXY.x += dx; charXY.y += dy;
        let h = document.getElementById('hero'); h.style.left = charXY.x + 'px'; h.style.top = charXY.y + 'px';
        questions[cursor].options.forEach((o, i) => {
            let gate = document.getElementById('g'+i);
            if(charXY.x > 300 && Math.abs(charXY.y - (40 + i*105)) < 40) validate(o.isCorrect, gate);
        });
    }

    function validate(ok, el) {
        if(ok) { score += 10; el.style.background = "var(--s)"; } else { el.style.background = "var(--r)"; }
        setTimeout(() => {
            cursor++;
            if(cursor < questions.length) renderStep();
            else finish();
        }, 700);
    }

    function finish() {
        document.getElementById('stage').innerHTML = `
            <div style="text-align:center; padding-top:100px;">
                <h1>ФИНИШ! 🏆</h1>
                <p>Твой результат: ${score} очков</p>
                <button class="btn btn-p" style="width:220px" onclick="location.reload()">В МЕНЮ</button>
            </div>`;
    }

    function exportCode() {
        collectData();
        const blob = btoa(unescape(encodeURIComponent(JSON.stringify({m: currentMode, q: questions}))));
        new QRCode(document.getElementById("qrcode"), { text: blob, width: 180, height: 180 });
        document.getElementById('qr-modal').style.display = 'flex';
        navigator.clipboard.writeText(blob);
    }

    function importCode() {
        let code = prompt("Вставь код игры:");
        if(code) {
            let data = JSON.parse(decodeURIComponent(escape(atob(code))));
            currentMode = data.m; questions = data.q;
            cursor = 0; score = 0; switchScreen('sc-game'); renderStep();
        }
    }
</script>
</body>
</html>
