<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GrammaLab PRO 8.0 Ultimate</title>
    <style>
        /* ОСНОВНЫЕ ПЕРЕМЕННЫЕ ЦВЕТОВ */
        :root { 
            --p: #00a2ff; 
            --bg: #f0f4f8; 
            --ai: #6c5ce7; 
            --s: #2ecc71; 
            --red: #ff4757; 
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            touch-action: manipulation; 
            user-select: none; 
            overflow-x: hidden; 
        }

        header { 
            background: white; 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }

        /* ЭКРАНЫ */
        .screen { 
            display: none; 
            padding: 15px; 
            max-width: 500px; 
            margin: 0 auto; 
            animation: slideIn 0.3s ease-out; 
        }

        .active { 
            display: block; 
        }

        /* КНОПКИ */
        .btn { 
            padding: 18px; 
            border-radius: 22px; 
            border: none; 
            font-weight: 900; 
            cursor: pointer; 
            width: 100%; 
            margin: 8px 0; 
            font-size: 17px; 
            color: white; 
            text-transform: uppercase; 
            transition: 0.2s; 
            position: relative; 
            overflow: hidden; 
        }

        .btn-p { background: var(--p); box-shadow: 0 6px 0 #0081cc; }
        .btn-ai { background: var(--ai); box-shadow: 0 6px 0 #5649c0; }
        .btn-s { background: var(--s); box-shadow: 0 6px 0 #219150; }
        
        .btn:active { 
            transform: translateY(4px); 
            box-shadow: none; 
        }

        /* СЕТКА МЕНЮ */
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 12px; 
        }

        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 25px; 
            text-align: center; 
            border: 2px solid #e2e8f0; 
            cursor: pointer; 
            transition: 0.3s; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .card span { 
            font-size: 40px; 
            display: block; 
            margin-bottom: 8px; 
        }

        /* ИГРОВАЯ АРЕНА */
        #stage { 
            background: white; 
            border-radius: 35px; 
            min-height: 420px; 
            position: relative; 
            border: 6px solid var(--p); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            margin-bottom: 15px; 
            box-shadow: inset 0 0 30px rgba(0,0,0,0.03);
        }

        /* КОЛЕСО */
        .wheel-container { 
            position: relative; 
            width: 350px; 
            height: 350px; 
        }

        #cv { 
            transition: transform 4s cubic-bezier(0.1, 0, 0.2, 1); 
            width: 100%; 
            height: 100%; 
        }

        .pointer { 
            position: absolute; 
            top: -10px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 0; 
            height: 0; 
            border-left: 20px solid transparent; 
            border-right: 20px solid transparent; 
            border-top: 35px solid var(--red); 
            z-index: 100; 
        }

        /* КРОТ */
        .mole { 
            width: 85px; 
            height: 100px; 
            background: #8d6e63; 
            border-radius: 30px 30px 10px 10px; 
            position: absolute; 
            bottom: -120px; 
            transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            font-size: 12px; 
            font-weight: bold; 
            border: 3px solid #5d4037; 
        }

        .mole.up { bottom: 25px; }

        /* ОБЛАКА (ПОГОНЯ) */
        .cloud {
            position: absolute;
            background: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            font-weight: 900;
            transition: 5s linear;
            white-space: nowrap;
            border: 2px solid var(--p);
            right: -250px;
        }

        /* ПАРЫ */
        .pair-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            padding: 10px; 
            width: 100%; 
        }

        .pair-card { 
            height: 80px; 
            background: var(--ai); 
            border-radius: 15px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: transparent; 
            font-size: 11px; 
            text-align: center; 
            font-weight: bold; 
            transition: 0.3s; 
            border: 2px solid rgba(0,0,0,0.1); 
        }

        .pair-card.open { 
            background: white; 
            color: var(--ai); 
            border-color: var(--ai); 
        }

        /* РЕДАКТОР */
        .qi-box { 
            background: white; 
            padding: 15px; 
            border-radius: 20px; 
            margin-bottom: 15px; 
            border: 2px solid #e2e8f0; 
        }

        @keyframes slideIn { 
            from { transform: translateY(20px); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight:900; color:var(--p); font-size: 22px;">GRAMMA PRO 8.0</div>
    <div id="score-val" style="font-weight:900; font-size: 20px;">0 ⭐</div>
    <button onclick="location.reload()" style="background:none; border:none; font-size:28px; cursor:pointer;">🏠</button>
</header>

<div id="sc-menu" class="screen active">
    <div class="grid" id="menu-box"></div>
    <button class="btn btn-s" style="margin-top:20px;" onclick="importGame()">📥 ЗАГРУЗИТЬ КОД ГРАММАТИКИ</button>
</div>

<div id="sc-edit" class="screen">
    <button class="btn btn-ai" onclick="aiFill()">✨ ИИ: ГЛАГОЛЫ / ОЧП / РЕЧЬ</button>
    <div id="factory">
        </div>
    <button class="btn" style="background:#636e72" onclick="addQ()">➕ ДОБАВИТЬ СВОЙ ВОПРОС</button>
    <div class="grid">
        <button class="btn btn-s" onclick="exportCode()">📤 СОХРАНИТЬ КОД</button>
        <button class="btn btn-p" onclick="startPlay()">ИГРАТЬ ▶️</button>
    </div>
</div>

<div id="sc-game" class="screen">
    <div id="q-text" style="font-weight:900; text-align:center; font-size:20px; margin-bottom:10px; min-height:50px; color:#2d3436;"></div>
    <div id="stage"></div>
    <div id="options" class="grid"></div>
</div>

<script>
    /* НАСТРОЙКИ РЕЖИМОВ */
    const modes = [
        {id:'wheel', n:'Колесо', e:'🎡'},
        {id:'mole', n:'Крот', e:'🔨'},
        {id:'plane', n:'Погоня', e:'✈️'},
        {id:'cards', n:'Карточки', e:'💡'},
        {id:'anagram', n:'Слова', e:'🔠'},
        {id:'slots', n:'Автомат', e:'🎰'},
        {id:'maze', n:'Лабиринт', e:'👾'},
        {id:'pairs', n:'Пары', e:'👥'}
    ];

    let mode = '';
    let qs = [];
    let cur = 0;
    let score = 0;
    let rot = 0;

    /* ИНИЦИАЛИЗАЦИЯ МЕНЮ */
    modes.forEach(m => {
        const d = document.createElement('div');
        d.className = 'card';
        d.innerHTML = `<span>${m.e}</span><b>${m.n}</b>`;
        d.onclick = () => { 
            mode = m.id; 
            show('sc-edit'); 
            document.getElementById('factory').innerHTML=''; 
            addQ(); 
        };
        document.getElementById('menu-box').appendChild(d);
    });

    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    /* ФУНКЦИЯ ДОБАВЛЕНИЯ ВОПРОСА В РЕДАКТОРЕ */
    function addQ(q='', a=['','',''], c=0) {
        const id = Date.now() + Math.random();
        const d = document.createElement('div');
        d.className = 'qi-box';
        d.innerHTML = `
            <input type="text" placeholder="Введите вопрос..." value="${q}" class="qi" style="width:100%; padding:12px; margin-bottom:12px; border-radius:12px; border:1px solid #ddd; box-sizing:border-box; font-size:16px;">
            <div style="font-size:12px; margin-bottom:8px; color:var(--ai); font-weight:bold;">ОТМЕТЬТЕ ПРАВИЛЬНЫЙ ВАРИАНТ:</div>
            <div class="opt-inputs">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
                    <input type="radio" name="r_${id}" ${c===0?'checked':''} value="0">
                    <input type="text" placeholder="Вариант 1" value="${a[0]||''}" class="ai" style="flex:1; padding:8px; border-radius:8px; border:1px solid #eee;">
                </div>
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
                    <input type="radio" name="r_${id}" ${c===1?'checked':''} value="1">
                    <input type="text" placeholder="Вариант 2" value="${a[1]||''}" class="ai" style="flex:1; padding:8px; border-radius:8px; border:1px solid #eee;">
                </div>
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
                    <input type="radio" name="r_${id}" ${c===2?'checked':''} value="2">
                    <input type="text" placeholder="Вариант 3" value="${a[2]||''}" class="ai" style="flex:1; padding:8px; border-radius:8px; border:1px solid #eee;">
                </div>
            </div>
            <button style="color:var(--red); border:none; background:none; font-size:13px; cursor:pointer; font-weight:bold; margin-top:10px;" onclick="this.parentElement.remove()">🗑 УДАЛИТЬ ВОПРОС</button>
        `;
        document.getElementById('factory').appendChild(d);
    }

    /* ИИ ГЕНЕРАТОР ПО ТВОИМ ТЕМАМ */
    function aiFill() {
        const rules = [
            {q: "Укажите спряжение глагола 'СМОТРЕТЬ':", a: ["II спряжение (искл.)", "I спряжение", "II спряжение"], c: 0},
            {q: "Где нужны запятые при ОЧП?", a: ["Перед союзом А", "Перед одиночным И", "Нигде не нужны"], c: 0},
            {q: "Выберите верную схему прямой речи:", a: ["А: 'П.'", "'П', а.", "А - 'П'"], c: 0},
            {q: "В каком слове пропущена буква И? (Они стро..т)", a: ["строят (II спр.)", "строют", "строят (I спр.)"], c: 0},
            {q: "Найди ОЧП в предложении:", a: ["Синие, красные шары", "Летит птица", "Мама мыла раму"], c: 0},
            {q: "Глагол-исключение I спряжения:", a: ["Стелить", "Держать", "Видеть"], c: 0}
        ];
        const r = rules[Math.floor(Math.random() * rules.length)];
        addQ(r.q, r.a, r.c);
    }

    /* СОХРАНЕНИЕ ВОПРОСОВ */
    function saveQs() {
        qs = [];
        document.querySelectorAll('.qi-box').forEach(box => {
            const q = box.querySelector('.qi').value;
            const r = box.querySelectorAll('input[type="radio"]');
            const ai = box.querySelectorAll('.ai');
            let ci = 0;
            r.forEach((rd, i) => { if(rd.checked) ci = i; });
            const o = [];
            ai.forEach((inp, i) => { 
                if(inp.value) o.push({t: inp.value, ok: i === ci}); 
            });
            if(q) qs.push({q, opts: o});
        });
    }

    function startPlay() {
        saveQs();
        if(qs.length > 0) {
            cur = 0;
            score = 0;
            show('sc-game');
            render();
        } else {
            alert("Сначала добавьте хотя бы один вопрос!");
        }
    }

    /* ГЛАВНЫЙ ДВИЖОК ИГРЫ */
    function render() {
        const it = qs[cur];
        const st = document.getElementById('stage');
        const op = document.getElementById('options');
        st.innerHTML = ""; 
        op.innerHTML = ""; 
        document.getElementById('score-val').innerText = score + " ⭐";
        document.getElementById('q-text').innerText = it.q;

        /* ЛОГИКА ДЛЯ КОЛЕСА */
        if(mode === 'wheel') {
            document.getElementById('q-text').innerText = "КРУТИТЕ КОЛЕСО ВОПРОСОВ!";
            st.innerHTML = `
                <div class="wheel-container">
                    <div class="pointer"></div>
                    <canvas id="cv" width="400" height="400"></canvas>
                </div>
            `;
            const c = document.getElementById('cv');
            const ctx = c.getContext('2d');
            const slice = (Math.PI * 2) / qs.length;

            qs.forEach((item, i) => {
                ctx.beginPath();
                ctx.fillStyle = i % 2 ? '#00a2ff' : '#6c5ce7';
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 195, i * slice, (i + 1) * slice);
                ctx.fill();
                ctx.save();
                ctx.translate(200, 200);
                ctx.rotate(i * slice + slice / 2);
                ctx.fillStyle = "white";
                ctx.font = "bold 14px Arial";
                ctx.textAlign = "right";
                ctx.fillText(item.q.substring(0, 15) + "...", 170, 5);
                ctx.restore();
            });

            st.onclick = () => {
                st.onclick = null;
                rot += 1800 + Math.random() * 1000;
                c.style.transform = `rotate(${rot}deg)`;
                setTimeout(() => {
                    const final = rot % 360;
                    const real = 360 - final;
                    cur = Math.floor(((real + 270) % 360) / (360 / qs.length));
                    const selected = qs[cur];
                    document.getElementById('q-text').innerText = selected.q;
                    st.innerHTML = `<h2 style="padding:20px; text-align:center;">${selected.q}</h2>`;
                    selected.opts.forEach(o => {
                        const b = document.createElement('button');
                        b.className = 'btn btn-p';
                        b.innerText = o.t;
                        b.onclick = () => check(o.ok);
                        op.appendChild(b);
                    });
                }, 4100);
            };
        } 
        /* ЛОГИКА ДЛЯ ПОГОНИ (ОБЛАКА) */
        else if(mode === 'plane') {
            it.opts.forEach((o, i) => {
                const cloud = document.createElement('div');
                cloud.className = 'cloud';
                cloud.innerText = "☁️ " + o.t;
                cloud.style.top = (60 + i * 110) + "px";
                st.appendChild(cloud);
                setTimeout(() => { cloud.style.right = '120%'; }, 100);
                cloud.onclick = () => check(o.ok);
            });
        }
        /* ЛОГИКА ДЛЯ АВТОМАТА */
        else if(mode === 'slots') {
            st.innerHTML = `
                <div id="sb" style="font-size:32px; font-weight:900; background:#f8f9fa; padding:30px; border-radius:20px; border:5px solid gold; text-align:center; min-width:200px;">???</div>
                <button class="btn btn-s" id="spn" style="width:180px; margin-top:20px;">🎰 ЗАПУСТИТЬ</button>
            `;
            document.getElementById('spn').onclick = () => {
                let cnt = 0;
                const iv = setInterval(() => {
                    document.getElementById('sb').innerText = it.opts[cnt % it.opts.length].t;
                    cnt++;
                    if(cnt > 20) {
                        clearInterval(iv);
                        const fIdx = Math.floor(Math.random() * it.opts.length);
                        const final = it.opts[fIdx];
                        document.getElementById('sb').innerText = final.t;
                        setTimeout(() => check(final.ok), 1000);
                    }
                }, 100);
            };
        }
        /* ЛОГИКА ДЛЯ КРОТА */
        else if(mode === 'mole') {
            it.opts.forEach((o, i) => {
                const hole = document.createElement('div');
                hole.style = `width:100px; height:35px; background:rgba(0,0,0,0.1); border-radius:50%; position:absolute; bottom:40px; left:${15 + i * 30}%;`;
                const m = document.createElement('div');
                m.className = 'mole';
                m.innerText = o.t;
                m.onclick = () => check(o.ok);
                hole.appendChild(m);
                st.appendChild(hole);
                setTimeout(() => m.classList.add('up'), 200 + i * 200);
            });
        }
        /* ЛОГИКА ДЛЯ ПАР */
        else if(mode === 'pairs') {
            st.innerHTML = `<div class="pair-grid"></div>`;
            const g = st.querySelector('.pair-grid');
            const doubleOpts = [...it.opts, ...it.opts].sort(() => Math.random() - 0.5);
            doubleOpts.forEach(o => {
                const c = document.createElement('div');
                c.className = 'pair-card';
                c.innerText = o.t;
                c.onclick = () => {
                    c.classList.add('open');
                    if(o.ok) setTimeout(() => check(true), 500);
                };
                g.appendChild(c);
            });
        }
        /* СТАНДАРТНЫЙ РЕЖИМ (КАРТОЧКИ) */
        else {
            it.opts.forEach(o => {
                const b = document.createElement('button');
                b.className = 'btn btn-p';
                b.innerText = o.t;
                b.onclick = () => check(o.ok);
                op.appendChild(b);
            });
        }
    }

    /* ПРОВЕРКА ОТВЕТА */
    function check(ok) {
        if(ok) {
            score += 10;
            // Анимация успеха
            document.getElementById('stage').style.borderColor = "var(--s)";
            setTimeout(() => {
                document.getElementById('stage').style.borderColor = "var(--p)";
                cur++;
                if(cur < qs.length) render(); else finish();
            }, 600);
        } else {
            score = Math.max(0, score - 5);
            document.getElementById('stage').style.borderColor = "var(--red)";
            alert("Упс! Попробуй еще раз.");
            document.getElementById('stage').style.borderColor = "var(--p)";
            render();
        }
    }

    function finish() {
        document.getElementById('q-text').innerText = "ПОБЕДА!";
        document.getElementById('stage').innerHTML = `
            <div style="text-align:center">
                <h1 style="font-size:60px; margin:0;">🏆</h1>
                <h2 style="color:var(--s)">ТЫ МОЛОДЕЦ!</h2>
                <div style="font-size:32px; font-weight:900; margin:15px 0;">${score} ⭐</div>
                <button class="btn btn-p" onclick="location.reload()">ВЕРНУТЬСЯ В МЕНЮ</button>
            </div>
        `;
        document.getElementById('options').innerHTML = "";
    }

    /* ИМПОРТ И ЭКСПОРТ */
    function exportCode() {
        saveQs();
        const code = btoa(unescape(encodeURIComponent(JSON.stringify({m: mode, q: qs}))));
        const finalCode = "GRAMMA-" + code;
        prompt("Скопируйте этот код игры:", finalCode);
    }

    function importGame() {
        let code = prompt("Вставьте код игры:");
        if(!code) return;
        if(code.startsWith("GRAMMA-")) code = code.replace("GRAMMA-", "");
        try {
            const dec = JSON.parse(decodeURIComponent(escape(atob(code))));
            mode = dec.m;
            qs = dec.q;
            cur = 0;
