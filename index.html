<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GrammaLab.Kids</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ff4757; --pink: #ff6b81; --blue: #00a2ff; --bg: #f8fafc; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); overflow-x: hidden; }
        .red-top { height: 6px; background: var(--red); width: 100%; position: fixed; top:0; z-index:100;}
        header { background: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; margin-top: 6px; }
        .logo { font-family: 'Pacifico', cursive; color: var(--pink); font-size: 26px; }
        .score { font-weight: bold; font-size: 18px; color: #444; }
        
        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        .screen { display: none; }
        .active { display: block; }
        
        /* КАРТОЧКИ МЕНЮ */
        .mode-card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; border: 1px solid #f0f0f0; }
        .mode-card span { font-size: 40px; }
        .mode-card b { font-size: 18px; color: #444; }

        /* ИГРОВОЙ ЭКРАН */
        #stage { background: white; border-radius: 30px; min-height: 350px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .ans-btn { background: white; border: 2px solid #eee; padding: 16px; border-radius: 15px; width: 100%; margin-top: 10px; font-weight: 600; cursor: pointer; font-size: 16px; }

        /* МЕХАНИКИ */
        .mole { width: 80px; height: 100px; background: #8d6e63; border-radius: 40px 40px 10px 10px; position: absolute; bottom: -120px; transition: 0.4s; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: bold; border: 3px solid #5d4037; }
        .mole.up { bottom: 20px; }
        .cloud { position: absolute; background: white; padding: 12px 20px; border-radius: 30px; border: 3px solid var(--blue); right: -300px; animation: fly 5s linear forwards; cursor: pointer; font-weight: bold; }
        @keyframes fly { from { right: -300px; } to { right: 110%; } }

        /* КОЛЕСО */
        #cv { width: 300px; height: 300px; transition: transform 4s cubic-bezier(0.1, 0, 0.2, 1); }
        .pointer { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid var(--red); margin-bottom: -20px; z-index: 10; position: relative; }

        /* РЕДАКТОР */
        .qi-box { background: white; padding: 15px; border-radius: 15px; border: 1px solid #ddd; margin-bottom: 10px; }
        .btn { padding: 15px; border-radius: 15px; border: none; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-purp { background: #6c5ce7; color: white; }
        input { width: 100%; padding: 10px; border: 1px solid #eee; border-radius: 10px; box-sizing: border-box; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="red-top"></div>
<header>
    <div class="logo">GrammaLab.Kids</div>
    <div class="score">🏆 Очки: <span id="score-val">0</span></div>
</header>

<div class="container">
    <div id="sc-menu" class="screen active">
        <h2 style="text-align:center; color:#555;">Выбери режим:</h2>
        <div id="menu-list"></div>
        <button class="btn" style="color:gray" onclick="importGame()">📥 Загрузить код игры</button>
    </div>

    <div id="sc-edit" class="screen">
        <button class="btn btn-purp" onclick="aiFill()">🤖 ИИ: Подбор вопросов</button>
        <div id="factory" style="margin:20px 0;"></div>
        <button class="btn btn-blue" onclick="startGame()">ИГРАТЬ ▶️</button>
        <button class="btn" style="background:#2ecc71; color:white;" onclick="exportGame()">📤 Скопировать код</button>
    </div>

    <div id="sc-game" class="screen">
        <div id="q-title" style="text-align:center; font-weight:bold; font-size:18px; margin-bottom:15px;"></div>
        <div id="stage"></div>
        <div id="controls"></div>
    </div>
</div>

<script>
    let mode = '', qs = [], cur = 0, score = 0, rot = 0;
    
    const games = [
        {id:'wheel', n:'Колесо', e:'🎡'}, {id:'mole', n:'Кроты', e:'🔨'},
        {id:'plane', n:'Самолет', e:'✈️'}, {id:'anagram', n:'Слова', e:'🔠'},
        {id:'pairs', n:'Пары', e:'👥'}, {id:'maze', n:'Лабиринт', e:'👾'},
        {id:'cards', n:'Карточки', e:'💡'}
    ];

    const aiData = {
        "не": [
            {q:"Как пишется (не)навидеть?", a1:"Слитно", a2:"Раздельно"},
            {q:"(Не) был в кино?", a1:"Раздельно", a2:"Слитно"}
        ],
        "глагол": [
            {q:"Спряжение 'брить':", a1:"1 спряжение", a2:"2 спряжение"}
        ]
    };

    const ml = document.getElementById('menu-list');
    games.forEach(g => {
        ml.innerHTML += `<div class="mode-card" onclick="initEditor('${g.id}')"><span>${g.e}</span><b>${g.n}</b></div>`;
    });

    function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function initEditor(m) { mode = m; show('sc-edit'); document.getElementById('factory').innerHTML=''; addQ(); }

    function addQ(q='', a1='', a2='') {
        const d = document.createElement('div'); d.className = 'qi-box';
        d.innerHTML = `<input type="text" placeholder="Вопрос" value="${q}" class="qi">
        <input type="text" placeholder="Правда" value="${a1}" class="ok">
        <input type="text" placeholder="Ложь" value="${a2}" class="no">`;
        document.getElementById('factory').appendChild(d);
    }

    function aiFill() {
        const t = prompt("Тема? (не / глагол)");
        const d = aiData[t] || aiData["не"];
        d.forEach(i => addQ(i.q, i.a1, i.a2));
    }

    function startGame() {
        qs = [];
        document.querySelectorAll('.qi-box').forEach(b => {
            const q = b.querySelector('.qi').value, a1 = b.querySelector('.ok').value, a2 = b.querySelector('.no').value;
            if(q) qs.push({q, opts: [{t: a1, ok: true}, {t: a2, ok: false}].sort(() => Math.random() - 0.5)});
        });
        if(qs.length) { cur = 0; score = 0; show('sc-game'); play(); }
    }

    function play() {
        const stage = document.getElementById('stage');
        const ctrl = document.getElementById('controls');
        const tit = document.getElementById('q-title');
        stage.innerHTML = ""; ctrl.innerHTML = ""; tit.innerText = qs[cur].q;

        if(mode === 'wheel' && cur === 0) {
            stage.innerHTML = `<div class="pointer"></div><canvas id="cv" width="400" height="400"></canvas>`;
            const cv = document.getElementById('cv'); const ctx = cv.getContext('2d');
            for(let i=0; i<8; i++){
                ctx.beginPath(); ctx.fillStyle = i%2 ? '#ff6b81' : '#00a2ff';
                ctx.moveTo(200,200); ctx.arc(200,200,190, i*(Math.PI/4), (i+1)*(Math.PI/4)); ctx.fill();
            }
            cv.onclick = () => {
                rot += 1800 + Math.random()*1000; cv.style.transform = `rotate(${rot}deg)`;
                setTimeout(() => { stage.innerHTML = ""; renderQ(); }, 4000);
            };
        } else if(mode === 'mole') {
            qs[cur].opts.forEach((o, i) => {
                const m = document.createElement('div'); m.className = 'mole'; m.innerText = o.t;
                m.style.left = (i * 150 + 50) + "px"; stage.appendChild(m);
                setTimeout(() => m.classList.add('up'), 100);
                m.onclick = () => check(o.ok);
            });
        } else if(mode === 'plane') {
            qs[cur].opts.forEach((o, i) => {
                const c = document.createElement('div'); c.className = 'cloud'; c.innerText = "✈️ " + o.t;
                c.style.top = (i * 80 + 50) + "px"; stage.appendChild(c);
                c.onclick = () => check(o.ok);
            });
        } else if(mode === 'pairs') {
            let p = [...qs[cur].opts, ...qs[cur].opts].sort(() => Math.random() - 0.5);
            stage.style.display="grid"; stage.style.gridTemplateColumns="1fr 1fr";
            p.forEach(o => {
                const d = document.createElement('div'); d.style="height:80px; background:var(--blue); border-radius:15px; margin:5px;";
                d.onclick = () => { d.style.background="white"; d.innerText=o.t; if(o.ok) setTimeout(()=>check(true), 500); };
                stage.appendChild(d);
            });
        } else { renderQ(); }
    }

    function renderQ() {
        const ctrl = document.getElementById('controls');
        qs[cur].opts.forEach(o => {
            const b = document.createElement('button'); b.className = 'ans-btn'; b.innerText = o.t;
            b.onclick = () => check(o.ok); ctrl.appendChild(b);
        });
    }

    function check(ok) {
        if(ok) { score += 10; cur++; document.getElementById('score-val').innerText = score;
                 if(cur < qs.length) play(); else finish(); }
        else { alert("Ошибка! ❌"); }
    }

    function finish() {
        document.getElementById('stage').innerHTML = "<h1>🏆 ПОБЕДА!</h1>";
        document.getElementById('controls').innerHTML = `<button class="btn btn-blue" onclick="location.reload()">В МЕНЮ</button>`;
    }

    function exportGame() {
        const c = btoa(unescape(encodeURIComponent(JSON.stringify({m: mode, q: qs}))));
        prompt("Твой код:", c);
    }

    function importGame() {
        const c = prompt("Вставь код:");
        if(c) { const d = JSON.parse(decodeURIComponent(escape(atob(c)))); mode = d.m; qs = d.q; startGame(); }
    }
</script>
</body>
</html>
