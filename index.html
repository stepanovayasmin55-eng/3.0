<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GrammaLab PRO 9.0 Final</title>
    <style>
        :root { --p: #00a2ff; --bg: #f0f4f8; --ai: #6c5ce7; --s: #2ecc71; --red: #ff4757; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); touch-action: manipulation; user-select: none; overflow-x: hidden; }
        header { background: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 1000; }
        .screen { display: none; padding: 15px; max-width: 500px; margin: 0 auto; animation: slideIn 0.3s ease-out; }
        .active { display: block; }
        .btn { padding: 18px; border-radius: 22px; border: none; font-weight: 900; cursor: pointer; width: 100%; margin: 8px 0; font-size: 17px; color: white; text-transform: uppercase; transition: 0.2s; position: relative; overflow: hidden; }
        .btn-p { background: var(--p); box-shadow: 0 6px 0 #0081cc; }
        .btn-ai { background: var(--ai); box-shadow: 0 6px 0 #5649c0; }
        .btn-s { background: var(--s); box-shadow: 0 6px 0 #219150; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: white; padding: 20px; border-radius: 25px; text-align: center; border: 2px solid #e2e8f0; cursor: pointer; transition: 0.3s; }
        #stage { background: white; border-radius: 35px; min-height: 420px; position: relative; border: 6px solid var(--p); overflow: hidden; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        
        .confetti { position: fixed; width: 10px; height: 10px; z-index: 9999; pointer-events: none; }
        .wheel-container { position: relative; width: 320px; height: 320px; }
        #cv { transition: transform 4s cubic-bezier(0.1, 0, 0.2, 1); width: 100%; height: 100%; }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid var(--red); z-index: 100; }
        
        /* Погоня (Облака) */
        .cloud { position: absolute; background: white; padding: 12px 20px; border-radius: 30px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer; font-weight: 900; white-space: nowrap; border: 2px solid var(--p); right: -300px; animation: fly 5s linear forwards; }
        @keyframes fly { from { right: -300px; } to { right: 110%; } }

        .maze-gate { position: absolute; right: 20px; width: 130px; padding: 10px; background: white; border: 3px solid var(--p); border-radius: 15px; cursor: pointer; text-align: center; font-weight: bold; font-size: 13px; }
        .mole { width: 80px; height: 100px; background: #8d6e63; border-radius: 30px 30px 10px 10px; position: absolute; bottom: -120px; transition: 0.4s; color: white; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: bold; border: 3px solid #5d4037; }
        .mole.up { bottom: 25px; }
        .pair-card { height: 70px; background: var(--ai); border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: transparent; font-size: 10px; text-align: center; font-weight: bold; transition: 0.3s; border: 1px solid rgba(0,0,0,0.1); }
        .pair-card.open { background: white; color: var(--ai); border-color: var(--ai); }
        
        .qi-box { background: white; padding: 15px; border-radius: 20px; margin-bottom: 15px; border: 2px solid #e2e8f0; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <div style="font-weight:900; color:var(--p); font-size: 22px;">GRAMMA 9.0</div>
    <div id="score-val" style="font-weight:900; font-size: 20px;">0 ⭐</div>
    <button onclick="location.reload()" style="background:none; border:none; font-size:28px; cursor:pointer;">🏠</button>
</header>

<div id="sc-menu" class="screen active">
    <div class="grid" id="menu-box"></div>
    <button class="btn btn-s" onclick="importGame()">📥 ЗАГРУЗИТЬ КОД</button>
</div>

<div id="sc-edit" class="screen">
    <button class="btn btn-ai" onclick="aiInteractive()">🤖 ИИ: СПРОСИТЬ ТЕМУ</button>
    <div id="factory"></div>
    <button class="btn" style="background:#636e72" onclick="addQ()">➕ ДОБАВИТЬ ВОПРОС</button>
    <div class="grid">
        <button class="btn btn-s" onclick="exportCode()">📤 КОД</button>
        <button class="btn btn-p" onclick="startPlay()">ИГРАТЬ ▶️</button>
    </div>
</div>

<div id="sc-game" class="screen">
    <div id="q-text" style="font-weight:900; text-align:center; font-size:18px; margin-bottom:10px; min-height:45px; color:var(--ai);"></div>
    <div id="stage"></div>
    <div id="options" class="grid"></div>
</div>

<script>
    const modes = [
        {id:'wheel', n:'Колесо', e:'🎡'},{id:'mole', n:'Крот', e:'🔨'},
        {id:'plane', n:'Погоня', e:'✈️'},{id:'cards', n:'Карточки', e:'💡'},
        {id:'anagram', n:'Слова', e:'🔠'},{id:'maze', n:'Лабиринт', e:'👾'},
        {id:'pairs', n:'Пары', e:'👥'}
    ];
    let mode='', qs=[], cur=0, score=0, rot=0;

    modes.forEach(m => {
        const d = document.createElement('div'); d.className = 'card'; d.innerHTML = `<span>${m.e}</span><b>${m.n}</b>`;
        d.onclick = () => { mode = m.id; show('sc-edit'); document.getElementById('factory').innerHTML=''; addQ(); };
        document.getElementById('menu-box').appendChild(d);
    });

    function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

    function addQ(q='', a=['','',''], c=0) {
        const id = Date.now() + Math.random();
        const d = document.createElement('div'); d.className = 'qi-box';
        d.innerHTML = `<input type="text" placeholder="Вопрос..." value="${q}" class="qi" style="width:100%; padding:10px; margin-bottom:10px; border-radius:10px; border:1px solid #ddd; box-sizing:border-box;">
            ${[0,1,2].map(i => `<div style="display:flex; align-items:center; gap:8px; margin-bottom:5px;"><input type="radio" name="r_${id}" ${i===c?'checked':''}>
            <input type="text" placeholder="Вариант" value="${a[i]||''}" class="ai" style="flex:1; padding:6px; border-radius:5px; border:1px solid #eee;"></div>`).join('')}
            <button style="color:var(--red); border:none; background:none; font-size:11px; cursor:pointer;" onclick="this.parentElement.remove()">Удалить</button>`;
        document.getElementById('factory').appendChild(d);
    }

    const aiDatabase = {
        "глагол": [{q: "Спряжение 'СМОТРЕТЬ'?", a: ["II спр (искл)", "I спр", "II спр"], c: 0}],
        "очп": [{q: "ОЧП в: 'Пел и плясал'?", a: ["пел, плясал", "он", "и"], c: 0}],
        "не": [{q: "НЕ с глаголом 'пришел'?", a: ["Раздельно", "Слитно", "Через -"], c: 0}, {q: "НЕ с глаголом 'навидеть'?", a: ["Слитно", "Раздельно", "Через -"], c: 0}],
        "речь": [{q: "А: 'П.' - это?", a: ["Автор в начале", "Речь в начале", "Диалог"], c: 0}]
    };

    function aiInteractive() {
        const t = prompt("Тема? (глаголы, очп, не, речь)").toLowerCase();
        let k = "не"; if(t.includes("глагол")) k="глагол"; else if(t.includes("очп")) k="очп"; else if(t.includes("реч")) k="речь";
        const p = aiDatabase[k]; const r = p[Math.floor(Math.random() * p.length)];
        addQ(r.q, r.a, r.c);
    }

    function saveQs() {
        qs = []; document.querySelectorAll('.qi-box').forEach(box => {
            const q = box.querySelector('.qi').value; const r = box.querySelectorAll('input[type="radio"]'); const ai = box.querySelectorAll('.ai');
            let ci = 0; r.forEach((rd, i) => { if(rd.checked) ci = i; });
            const o = []; ai.forEach((inp, i) => { if(inp.value) o.push({t: inp.value, ok: i === ci}); });
            if(q) qs.push({q, opts: o});
        });
    }

    function startPlay() { saveQs(); if(qs.length) { cur = 0; score = 0; show('sc-game'); render(); } }

    function render() {
        const it = qs[cur]; const st = document.getElementById('stage'); const op = document.getElementById('options');
        st.innerHTML = ""; op.innerHTML = ""; document.getElementById('score-val').innerText = score + " ⭐";
        
        if(mode === 'wheel') {
            document.getElementById('q-text').innerText = "КРУТИ КОЛЕСО!";
            st.innerHTML = `<div class="wheel-container"><div class="pointer"></div><canvas id="cv" width="400" height="400"></canvas></div>`;
            const c = document.getElementById('cv'), ctx = c.getContext('2d'), slice = (Math.PI*2)/qs.length;
            qs.forEach((q, i) => {
                ctx.beginPath(); ctx.fillStyle = i%2 ? '#00a2ff' : '#6c5ce7'; ctx.moveTo(200,200); ctx.arc(200,200,195, i*slice, (i+1)*slice); ctx.fill();
                ctx.save(); ctx.translate(200,200); ctx.rotate(i*slice + slice/2); ctx.fillStyle="white"; ctx.font="bold 12px Arial"; ctx.textAlign="right"; ctx.fillText(q.q.substring(0,12)+'...', 180, 5); ctx.restore();
            });
            st.onclick = () => {
                st.onclick = null; rot += 1800 + Math.random()*1000; c.style.transform = `rotate(${rot}deg)`;
                setTimeout(() => {
                    const real = 360 - (rot % 360); cur = Math.floor(((real + 270) % 360) / (360/qs.length));
                    render(); // Перерисовать уже с кнопками
                }, 4100);
            };
            if(st.innerHTML === "") it.opts.forEach(o => { const b = document.createElement('button'); b.className = 'btn btn-p'; b.innerText = o.t; b.onclick = () => check(o.ok); op.appendChild(b); });
        }
        else if(mode === 'plane') {
            document.getElementById('q-text').innerText = it.q;
            it.opts.forEach((o, i) => {
                const c = document.createElement('div'); c.className = 'cloud'; 
                c.innerText = "✈️ " + o.t; c.style.top = (40 + i * 110) + "px";
                c.style.animationDelay = (i * 0.5) + 's';
                c.onclick = () => check(o.ok);
                st.appendChild(c);
            });
        }
        else if(mode === 'maze') {
            document.getElementById('q-text').innerText = it.q;
            st.innerHTML = `<div id="hero" style="position:absolute; left:20px; top:180px; font-size:40px; transition:0.6s;">👾</div>`;
            it.opts.forEach((o, i) => {
                const g = document.createElement('div'); g.className = 'maze-gate'; g.style.top = (40 + i*130) + "px"; g.innerText = o.t;
                g.onclick = () => { document.getElementById('hero').style.top = g.style.top; document.getElementById('hero').style.left = "220px"; setTimeout(() => check(o.ok), 600); };
                st.appendChild(g);
            });
        }
        else if(mode === 'mole') {
            document.getElementById('q-text').innerText = it.q;
            it.opts.forEach((o, i) => {
                const h = document.createElement('div'); h.style=`width:100px; height:30px; background:rgba(0,0,0,0.1); border-radius:50%; position:absolute; bottom:40px; left:${10+i*33}%;`;
                const m = document.createElement('div'); m.className = 'mole'; m.innerText = o.t; m.onclick = () => check(o.ok); h.appendChild(m); st.appendChild(h);
                setTimeout(() => m.classList.add('up'), 100+i*200);
            });
        }
        else if(mode === 'pairs') {
            document.getElementById('q-text').innerText = "НАЙДИ ПАРУ ПРАВИЛЬНОМУ ОТВЕТУ!";
            st.innerHTML = `<div class="grid" style="grid-template-columns: repeat(3, 1fr); width:95%; gap:8px;" id="pg"></div>`;
            const cards = [...it.opts, ...it.opts].sort(() => Math.random() - 0.5);
            cards.forEach(o => {
                const c = document.createElement('div'); c.className = 'pair-card'; c.innerText = o.t;
                c.onclick = () => { c.classList.add('open'); if(o.ok) setTimeout(() => check(true), 500); };
                document.getElementById('pg').appendChild(c);
            });
        }
        else {
            document.getElementById('q-text').innerText = it.q;
            it.opts.forEach(o => { const b = document.createElement('button'); b.className = 'btn btn-p'; b.innerText = o.t; b.onclick = () => check(o.ok); op.appendChild(b); });
        }
    }

    function check(ok) { if(ok) { score += 10; cur++; if(cur < qs.length) render(); else finish(); } else { score = Math.max(0, score - 5); alert("Ошибка! ❌"); render(); } }

    function spawnConfetti() {
        for(let i=0; i<60; i++) {
            const c = document.createElement('div'); c.className = 'confetti';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.background = ['#ff4757','#2ecc71','#00a2ff','#eccc68','#6c5ce7'][Math.floor(Math.random()*5)];
            c.style.animation = `fall ${Math.random()*3+2}s linear forwards`;
            document.body.appendChild(c);
            setTimeout(() => c.remove(), 5000);
        }
    }

    function finish() {
        spawnConfetti();
        document.getElementById('q-text').innerText = "ПОЗДРАВЛЯЕМ!";
        document.getElementById('stage').innerHTML = `
            <div style="text-align:center; animation: slideIn 0.5s;">
                <h1 style="font-size:80px; margin:0;">🏆</h1>
                <h2 style="color:var(--s); font-size:24px;">ИГРА ЗАВЕРШЕНА</h2>
                <div style="font-size:48px; font-weight:900; color:var(--ai); margin:20px 0;">${score} ⭐</div>
                <button class="btn btn-p" onclick="location.reload()">В МЕНЮ</button>
            </div>
        `;
        document.getElementById('options').innerHTML = "";
    }

    function exportCode() { saveQs(); const code = btoa(unescape(encodeURIComponent(JSON.stringify({m: mode, q: qs})))); navigator.clipboard.writeText(code).then(() => alert("Код скопирован!")); }
    function importGame() { const code = prompt("Код:"); if(code) { const dec = JSON.parse(decodeURIComponent(escape(atob(code)))); mode = dec.m; qs = dec.q; cur = 0; score = 0; show('sc-game'); render(); } }
</script>
</body>
</html>
